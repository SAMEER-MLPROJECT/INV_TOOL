name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend/attackgraph backend/tests scripts --select E,F,W,B,I --ignore E501,B008,B905,B007,E741
      - name: Unit, integration and known-answer tests
        working-directory: backend
        run: pytest -m "not e2e" --cov=attackgraph --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: frontend/dist

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: frontend/dist
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - name: Browser end-to-end tests
        working-directory: backend
        run: pytest -m e2e
